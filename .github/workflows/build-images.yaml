name: Build container images

on:
  pull_request:
    branches: [master, 'release-*']
  push:
    branches: [master, 'release-*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_TAG_RULES: |
    type=sha,format=long
    type=ref,event=branch
    type=ref,event=tag
    type=raw,value=latest,enable={{is_default_branch}}

jobs:
  build:
    if: github.repository == 'DoughOps/cert-manager'
    name: Build ${{ matrix.component }} (amd64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [controller, acmesolver, cainjector, webhook, startupapicheck]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the repository's Go version
        id: go-version
        run: make print-go-version >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: ${{ steps.go-version.outputs.result }}
          cache-dependency-path: '**/go.sum'

      - name: Prepare the upstream image build context
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: amd64
          GOMAXPROCS: '2'
        run: |
          context="_bin/scratch/build-context/cert-manager-${COMPONENT}-linux-${ARCH}"
          version="$(git describe --tags --always --match 'v[0-9]*' --abbrev=12)"
          if [[ ! "$version" =~ ^[a-zA-Z0-9.+_-]+$ ]]; then
            version="$GITHUB_SHA"
          fi
          make -j2 GOBUILDPROCS=2 GOFLAGS='-trimpath -mod=readonly -p=2' VERSION="$version" \
            "${context}/${COMPONENT}" \
            "${context}/cert-manager.license" \
            "${context}/cert-manager.licenses_notice"
          sed -i -E \
            "s#https://github.com/cert-manager/cert-manager/blob/[^/]+/LICENSES#https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/LICENSES#g" \
            "${context}/cert-manager.license" "${context}/cert-manager.licenses_notice"
          base_image="$(make --no-print-directory CI_ARCH="$ARCH" \
            --eval='print-image-base: ; @echo $(STATIC_BASE_IMAGE_$(CI_ARCH))' print-image-base)"
          test -n "$base_image"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "base=$base_image" >> "$GITHUB_OUTPUT"
          echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: ${{ env.IMAGE_TAG_RULES }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ steps.image.outputs.context }}
          file: hack/containers/Containerfile.${{ matrix.component }}
          platforms: linux/amd64
          build-args: BASE_IMAGE=${{ steps.image.outputs.base }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=${{ matrix.component }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-amd64
